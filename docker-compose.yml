services:
  db:
    image: postgres:16-alpine
    container_name: arg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: arg_adminer
    restart: unless-stopped
    ports: Hey a starv Hey a starvester local educational electronics for logic is a martial application that tells that
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
