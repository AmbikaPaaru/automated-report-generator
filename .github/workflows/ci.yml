name: CI

# Runs on every push to main and every PR targeting main. Both jobs run every time
# regardless of which side (backend/frontend) actually changed -- simpler and more
# reliable than conditional path-filtering, worth revisiting only if build times
# become a real problem.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # No live Postgres, LLM gateway, or Docker needed here -- tests use a local
      # SQLite DB and mock every LLM call (see backend/tests/conftest.py), so this
      # runs the same way in CI as it does on any laptop.
      - name: Run tests
        run: uv run pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Catches exactly the kind of build-breaking issue we hit deploying to Vercel
      # (the Turbopack/webpack build failure) here, in ~a minute, instead of only
      # discovering it after Vercel's own deploy fails.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
